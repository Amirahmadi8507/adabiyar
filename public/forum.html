<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>تالار گفت‌وگو | ادبیار</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="responsive.css"><link rel="stylesheet" href="persian.css">
<style>
:root{--gold:#d7ad69;--gold2:#f2d7a3;--paper:#f6efdf;--muted:#b7b1a5;--line:rgba(215,173,105,.3)}*{box-sizing:border-box}
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:#0b0e0d;color:var(--paper);line-height:1.9}a{color:var(--gold);text-decoration:none;font-weight:700}
header{position:relative;display:flex;align-items:center;gap:12px;padding:12px 4vw;background:#070a0be8;flex-wrap:wrap}header img{width:38px;height:38px}header .sp{flex:1}
main{max-width:900px;margin:0 auto;padding:26px 4vw 80px}h1{margin:.2em 0;color:var(--gold2)}.msg{color:var(--muted)}.err{color:#ff9a9a}.ok{color:#7fe0a4}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}select,input,textarea{font:inherit;border-radius:12px;border:1px solid #d7ad6988;background:#0b0e0d;color:var(--paper);padding:8px 12px;max-width:100%}
textarea{width:100%;min-height:90px}input.w{width:100%}button{font:inherit;min-height:42px;border:0;border-radius:99px;padding:2px 20px;background:var(--gold);color:#241a10;font-weight:700;cursor:pointer}button.o{background:transparent;color:var(--paper);border:1px solid var(--gold)}button.s{min-height:32px;padding:0 12px;font-size:13px}button.d{background:#a33;color:#fff}
.card{background:#111513;border:1px solid var(--line);border-radius:18px;padding:14px 18px;margin:10px 0}.topic{cursor:pointer;display:flex;gap:10px;align-items:center}.topic:hover{border-color:var(--gold)}.topic h3{margin:0;color:var(--gold2);font-size:1.05rem}.topic small{color:var(--muted)}.topic .n{margin-inline-start:auto;text-align:center;min-width:56px;color:var(--gold)}
.post{border-inline-start:3px solid var(--line);padding-inline-start:12px}.post.mod{border-color:var(--firouzeh,#33b3a6)}.post.hid{opacity:.5}.post small{color:var(--muted)}.post p{white-space:pre-wrap;margin:.3em 0}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.rep{border:1px dashed #d9615e;border-radius:14px;padding:8px 12px;margin:8px 0}
</style><link rel="stylesheet" href="nav.css"></head><body>
<div id="siteHeader"></div>
<main id="app"><p class="msg">در حال بارگذاری…</p></main>
<script src="site-header.js"></script><script src="forum.js"></script></body></html>
