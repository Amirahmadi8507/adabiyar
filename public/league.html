<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>لیگ ادبیار | ادبیار</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="responsive.css"><link rel="stylesheet" href="persian.css">
<style>
:root{--gold:#d7ad69;--gold2:#f2d7a3;--paper:#f6efdf;--muted:#b7b1a5;--line:rgba(215,173,105,.3)}*{box-sizing:border-box}
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:#0b0e0d;color:var(--paper);line-height:1.9}a{color:var(--gold);text-decoration:none;font-weight:700}
header{position:relative;display:flex;align-items:center;gap:12px;padding:12px 4vw;background:#070a0be8;flex-wrap:wrap}header img{width:38px;height:38px}header .sp{flex:1}
main{max-width:900px;margin:0 auto;padding:26px 4vw 80px}h1{margin:.2em 0;color:var(--gold2)}h2{color:var(--gold);margin:1.3em 0 .3em}.msg{color:var(--muted)}.err{color:#ff9a9a}
select{font:inherit;border-radius:12px;border:1px solid #d7ad6988;background:#0b0e0d;color:var(--paper);padding:8px 12px}
.card{background:#111513;border:1px solid var(--line);border-radius:18px;padding:14px 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.big{font-size:2rem;font-weight:800;color:var(--gold2)}.big.sm{font-size:1.25rem;white-space:nowrap}
table{display:table;width:100%;border-collapse:collapse}td,th{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right}th{color:var(--gold)}tr.me td{background:#33b3a622;font-weight:700}.tw{overflow-x:auto}.rk{font-size:1.3rem;width:56px}
.badge{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:3px 14px;margin:4px;opacity:.45}.badge.on{opacity:1;border-color:var(--gold);background:#d7ad6922}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}.podium .card b{display:block;font-size:1.6rem}ul.how{margin:.2em 0;padding-inline-start:1.2em}
</style><link rel="stylesheet" href="nav.css"></head><body>
