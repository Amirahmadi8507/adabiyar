<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>داشبورد دانش‌آموز | ادبیار</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="responsive.css"><link rel="stylesheet" href="persian.css"><link rel="stylesheet" href="report.css">
<style>
:root{--gold:#d7ad69;--gold2:#f2d7a3;--paper:#f6efdf;--muted:#b7b1a5;--line:rgba(215,173,105,.3)}*{box-sizing:border-box}
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:#0b0e0d;color:var(--paper);line-height:1.9}a{color:var(--gold);text-decoration:none;font-weight:700}
header{position:relative;display:flex;align-items:center;gap:12px;padding:12px 4vw;background:#070a0be8;flex-wrap:wrap}header img{width:38px;height:38px}header .sp{flex:1}
main{max-width:1050px;margin:0 auto;padding:30px 4vw 80px}h1{margin:.2em 0;color:var(--gold2)}h2{color:var(--gold);margin:1.4em 0 .4em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.stats{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}.stats .stat{font-size:1.6rem}
.card{background:#111513;border:1px solid var(--line);border-radius:18px;padding:16px 18px}.card h3{margin:0;color:var(--gold)}.card p{margin:.3em 0;color:var(--muted)}
.stat{font-size:2rem;font-weight:800;color:var(--gold2)}.bar{height:8px;border-radius:99px;background:#ffffff14;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#33b3a6,#d7ad69)}
form.join{display:flex;gap:8px;flex-wrap:wrap}form.join input{flex:1 1 160px;min-height:46px;font:800 1.3rem ui-monospace,Consolas,monospace;letter-spacing:.3em;text-align:center;text-transform:uppercase;direction:ltr;border-radius:12px;border:1px solid var(--gold);background:#0b0e0d;color:var(--paper)}
button,.btn{font:inherit;min-height:44px;border:0;border-radius:99px;padding:2px 22px;background:var(--gold);color:#241a10;font-weight:700;cursor:pointer}button.o{background:transparent;color:var(--paper);border:1px solid var(--gold)}
table{display:table;width:100%;border-collapse:collapse}.tw{overflow-x:auto}td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{color:var(--gold)}
.pill{padding:2px 12px;border-radius:99px;border:1px solid;font-size:13px}.good{color:#7fe0a4}.mid{color:var(--gold2)}.bad{color:#ff9a9a}.msg{color:var(--muted)}.err{color:#ff9a9a}.ok{color:#7fe0a4}
.quick{display:flex;gap:10px;flex-wrap:wrap}
</style><link rel="stylesheet" href="nav.css"></head><body>
<div id="siteHeader"></div>
<main id="app"><p class="msg">در حال بارگذاری…</p></main>
<script src="site-header.js"></script><script src="report-ui.js"></script><script src="student.js"></script></body></html>
