<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>دفترچه اشتباهات | ادبیار</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="responsive.css"><link rel="stylesheet" href="persian.css"><link rel="stylesheet" href="nav.css"><link rel="stylesheet" href="report.css">
<style>
:root{--gold:#d7ad69;--gold2:#f2d7a3;--paper:#f6efdf;--muted:#b7b1a5;--line:rgba(215,173,105,.3)}*{box-sizing:border-box}
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:#0b0e0d;color:var(--paper);line-height:1.9}a{color:var(--gold);text-decoration:none;font-weight:700}
main{max-width:920px;margin:0 auto;padding:26px 4vw 90px}h1{margin:.2em 0;color:var(--gold2)}h2{color:var(--gold);margin:1.4em 0 .4em}.msg{color:var(--muted)}.err{color:#ff9a9a}.ok{color:#7fe0a4}
.card{background:#111513;border:1px solid var(--line);border-radius:18px;padding:14px 18px;margin:12px 0}.card h3{margin:0;color:var(--gold2);font-size:1.05rem}
button{font:inherit;min-height:40px;border:1px solid var(--gold);background:transparent;color:var(--paper);border-radius:99px;padding:2px 18px;cursor:pointer}button:hover{background:#d7ad6922}button.p{background:var(--gold);color:#241a10;font-weight:700}button.s{min-height:32px;padding:0 14px;font-size:13px}
select{font:inherit;border-radius:12px;border:1px solid #d7ad6988;background:#0b0e0d;color:var(--paper);padding:7px 12px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.opt{border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin:5px 0}.opt.right{border-color:#33b3a6;background:#33b3a61f}.opt.wrong{border-color:#d9615e;background:#d9615e1f}.tag{font-size:12px;margin-inline-start:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{min-height:30px;padding:0 12px;font-size:13px}.chip.on{background:#d7ad6933;border-color:var(--gold2);color:var(--gold2)}
.ai{border-inline-start:3px solid #33b3a6;padding:6px 12px;background:#33b3a60f;border-radius:8px;white-space:pre-wrap;margin:8px 0}.ex{border-inline-start:3px solid var(--gold);padding:4px 12px;background:#ffffff08;border-radius:8px;margin:8px 0}
.pr{position:fixed;inset:0;background:#000d;z-index:200;display:none;place-items:center;padding:14px}.pr.on{display:grid}.pr .box{width:min(640px,100%);max-height:92vh;overflow:auto;background:#111513;border:1px solid var(--gold);border-radius:22px;padding:20px}
.pb{display:block;width:100%;text-align:right;margin:6px 0;border-radius:14px}
</style></head><body>
<div id="siteHeader"></div>
<main id="app"><h1>دفترچه اشتباهات من</h1><p class="msg">در حال بارگذاری…</p></main>
<div class="pr" id="pr"><div class="box" id="prBox"></div></div>
<script src="site-header.js"></script><script src="report-ui.js"></script><script src="mistakes.js"></script></body></html>
